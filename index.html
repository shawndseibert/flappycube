        
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FlappyCube</title>
	<style>
		html, body {
			height: 100%;
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			min-height: 100vh;
			background: linear-gradient(135deg, #18181b 60%, #22223b 100%);
			color: #fff;
			font-family: 'Press Start 2P', 'VT323', monospace, Arial, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: flex-start;
			padding: 0;
			overflow: hidden;
		}
		header {
				margin-top: 2vh;
				font-size: clamp(14px, 2.5cqw, 28px);
				letter-spacing: 0.1em;
				color: #00ffe7;
				text-shadow: 0 0 8px #00ffe7, 0 0 2px #fff;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
		}
		.game-container {
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
				box-sizing: border-box;
				padding: 0;
				aspect-ratio: 9/16;
				max-width: 98vw;
				max-height: 80vh;
				margin: auto;
		}
		canvas {
			background: #18181b;
			border: 4px solid #00ffe7;
			box-shadow: 0 0 32px #00ffe744, 0 0 8px #fff2;
			border-radius: 16px;
			display: block;
			margin: auto;
			width: 100%;
			height: auto;
			max-width: 98vw;
			max-height: 80vh;
			aspect-ratio: 9/16;
			transition: box-shadow 0.2s;
			box-sizing: border-box;
		}
		footer {
				margin: 2vh 0 1vh 0;
				font-size: clamp(12px, 1.8cqw, 20px);
				color: #ff00c8;
				text-shadow: 0 0 6px #ff00c8, 0 0 2px #fff;
				text-align: center;
				overflow-wrap: break-word;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
		}
		@media (max-width: 600px) {
			body {
				padding: 0;
			}
			.game-container {
					container-type: inline-size;
				padding: 0;
				height: calc(100vh - 60px);
			}
				header {
					font-size: clamp(12px, 4vw, 22px);
					white-space: normal;
					text-align: center;
					overflow-wrap: break-word;
				}
			canvas {
				width: 100%;
				height: auto;
				max-width: 98vw;
				max-height: 70vh;
				aspect-ratio: 9/16;
			}
				footer {
					font-size: clamp(10px, 3vw, 16px);
					white-space: normal;
					text-align: center;
					overflow-wrap: break-word;
				}
		}
	</style>
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
</head>
<body>
	<!-- Header removed -->
	<!-- Hamburger menu -->
	<div id="menuBtn" style="position: absolute; top: 18px; right: 18px; z-index: 10; cursor: pointer;">
		<div style="width: 38px; height: 38px; background: #22223b; border-radius: 12px; box-shadow: 0 0 8px #00ffe7; display: flex; align-items: center; justify-content: center;">
			<div style="display: flex; flex-direction: column; gap: 6px;">
				<div style="width: 22px; height: 4px; background: #00ffe7; border-radius: 2px;"></div>
				<div style="width: 22px; height: 4px; background: #00ffe7; border-radius: 2px;"></div>
				<div style="width: 22px; height: 4px; background: #00ffe7; border-radius: 2px;"></div>
			</div>
		</div>
	</div>
	<!-- Menu popup -->
	<div id="menuPopup" style="display:none; position: absolute; top: 62px; right: 18px; z-index: 20; background: #22223b; border-radius: 16px; box-shadow: 0 0 16px #00ffe7; border: 2px solid #00ffe7; min-width: 160px; padding: 16px 0;">
	<button id="newGameBtn" style="width: 100%; background: none; border: none; color: #fff; font-family: 'Press Start 2P', 'VT323', monospace; font-size: 18px; padding: 12px 0; cursor: pointer; text-align: center; white-space: nowrap; overflow: hidden;">New Game</button>
	<button id="muteBtn" style="width: 100%; background: none; border: none; color: #fff; font-family: 'Press Start 2P', 'VT323', monospace; font-size: 18px; padding: 12px 0; cursor: pointer; text-align: center; white-space: nowrap; overflow: hidden;">Mute Sounds: Off</button>
	</div>
	<div class="game-container">
		<canvas id="gameCanvas"></canvas>
	</div>
	<!-- Footer removed -->
	<script>
		// Mute sounds logic
		let soundsMuted = false;
		const muteBtn = document.getElementById('muteBtn');
		muteBtn.addEventListener('click', function() {
			soundsMuted = !soundsMuted;
			muteBtn.textContent = soundsMuted ? 'Mute Sounds: On' : 'Mute Sounds: Off';
			menuPopup.style.display = 'none';
		});
		// Hamburger menu logic
		const menuBtn = document.getElementById('menuBtn');
		const menuPopup = document.getElementById('menuPopup');
		const newGameBtn = document.getElementById('newGameBtn');
		menuBtn.addEventListener('click', function(e) {
			menuPopup.style.display = menuPopup.style.display === 'none' ? 'block' : 'none';
			e.stopPropagation();
		});
		// Hide menu when clicking outside
		document.addEventListener('mousedown', function(e) {
			if (!menuPopup.contains(e.target) && !menuBtn.contains(e.target)) {
				menuPopup.style.display = 'none';
			}
		});
		// New Game button logic
		newGameBtn.addEventListener('click', function() {
			localStorage.removeItem('flappycube_highscore');
			highScore = 0;
			lastScores = [];
			lastScore = null;
			showStartScreen = true;
			canStart = true;
			menuPopup.style.display = 'none';
			drawUI();
		});
		// Soft sine wave sound effects using Tone.js
const jumpSynth = new Tone.Synth({
    oscillator: { type: 'sine' },
    envelope: { attack: 0.01, decay: 0.03, sustain: 0.05, release: 0.04 }
}).toDestination();
jumpSynth.volume.value = -6;
const scoreSynth = new Tone.Synth({
    oscillator: { type: 'sine' },
    envelope: { attack: 0.01, decay: 0.1, sustain: 0.05, release: 0.08 }
}).toDestination();
const deathSynth = new Tone.NoiseSynth({
    noise: { type: 'white' },
    envelope: { attack: 0.01, decay: 0.08, sustain: 0, release: 0.08 }
}).toDestination();
deathSynth.volume.value = -12;
function playJump() {
    // Randomize pitch by +/- 2 semitones
    const base = Tone.Frequency('C5').toFrequency();
    const semitoneOffset = (Math.random() - 0.5) * 4; // -2 to +2 semitones
    const note = Tone.Frequency(base).transpose(semitoneOffset);
	if (!soundsMuted) jumpSynth.triggerAttackRelease(note, 0.08);
}
function playScore() {
	if (!soundsMuted) scoreSynth.triggerAttackRelease('E5', 0.12);
}
function playDeath() {
	if (!soundsMuted) deathSynth.triggerAttackRelease('0.08');
}

		// Responsive canvas setup
		const canvas = document.getElementById('gameCanvas');
		const ctx = canvas.getContext('2d');

		// Cube physics
		let cube = {
			x: 0,
			y: 0,
			size: 40,
			vy: 0,
			gravity: 0.18,
			jump: -7,
		};
	let gameActive = false;
	let pipes = [];
	let pipeGap = 0.28; // even narrower gap as fraction of canvas height
	let pipeWidth = 0.12; // width as fraction of canvas width
	let pipeSpeed = 1.5; // px per frame (floatier)
	let score = 0;
let lastScores = [];
let lastScore = null;
	let highScore = Number(localStorage.getItem('flappycube_highscore')) || 0;
	let showStartScreen = true;
	let canStart = true;

		function resetGame() {
			pipes = [];
			score = 0;
		}

		function spawnPipe() {
			let gapHeight = canvas.height * pipeGap;
			let minY = canvas.height * 0.12;
			let maxY = canvas.height - gapHeight - minY;
			let gapY = Math.floor(Math.random() * (maxY - minY) + minY);
			pipes.push({
				x: canvas.width,
				gapY: gapY,
				width: Math.floor(canvas.width * pipeWidth),
				gapHeight: gapHeight,
				passed: false,
				highlight: 0, // frames to highlight after scoring
				highlightPhase: 0 // 0: off, 1: fade-in, 2: fade-out
			});
		}

		function resizeCanvas() {
			// Always use a fixed portrait aspect ratio for the game area
			let w = canvas.parentElement.clientWidth;
			let h = canvas.parentElement.clientHeight;
			let aspectW = w;
			let aspectH = w * 16 / 9;
			if (aspectH > h) {
				aspectH = h;
				aspectW = h * 9 / 16;
			}
			canvas.width = Math.floor(aspectW);
			canvas.height = Math.floor(aspectH);
			cube.size = Math.min(canvas.width, canvas.height) * 0.08;
			cube.x = canvas.width/2 - cube.size/2;
			// Scale gravity and jump to canvas height for consistent feel
			cube.gravity = canvas.height * 0.00028; // maximum floatiness
			cube.jump = -canvas.height * 0.009; // fine-tuned ultra soft upward force
			// Scale pipe speed to canvas width for consistent speed
			pipeSpeed = canvas.width * 0.003; // slightly faster pipe speed
			if (!gameActive) {
				cube.y = canvas.height/2 - cube.size/2;
				cube.vy = 0;
			}
			resetGame();
			drawUI();
		}
		window.addEventListener('resize', resizeCanvas);

	function drawParallaxBackground(score) {
		ctx.clearRect(0, 0, canvas.width, canvas.height);
		// Calculate number of layers: 1 + every 2 points
		let layers = Math.min(1 + Math.floor(score / 2), 8); // max 8 layers
		// Brightness: 0 (dark) to 0.7 (not too bright)
		let brightness = Math.min(0.15 + score * 0.03, 0.7);
		// Base colors for layers (dark, muted)
		const baseColors = [
			[24, 24, 27],   // #18181b
			[34, 34, 59],   // #22223b
			[44, 44, 84],   // #2c2c54
			[60, 60, 100],  // #3c3c64
			[80, 80, 120],  // #505078
			[100, 100, 140],// #64648c
			[120, 120, 160],// #7878a0
			[140, 140, 180] // #8c8cb4
		];
		for (let i = 0; i < layers; i++) {
			// Parallax speed: slower for further layers
			let offset = ((score * (i + 1) * 2) % canvas.width) * (0.2 + i * 0.1);
			// Color: brighten as score increases
			let [r, g, b] = baseColors[i];
			r = Math.floor(r + brightness * 80);
			g = Math.floor(g + brightness * 80);
			b = Math.floor(b + brightness * 80);
			ctx.save();
			ctx.globalAlpha = 0.18 + i * 0.09;
			ctx.fillStyle = `rgb(${r},${g},${b})`;
			// Draw wavy hills for parallax effect
			ctx.beginPath();
			let hillHeight = canvas.height * (0.12 + i * 0.07);
			ctx.moveTo(0, canvas.height);
			for (let x = 0; x <= canvas.width; x += 8) {
				let y = canvas.height - hillHeight - Math.sin((x + offset) * 0.008 + i) * (18 + i * 8);
				ctx.lineTo(x, y);
			}
			ctx.lineTo(canvas.width, canvas.height);
			ctx.closePath();
			ctx.fill();
			ctx.restore();
		}
	}

	function drawUI() {
		drawParallaxBackground(score);
		// ...existing code...
			// Draw pipes
			for (let pipe of pipes) {
				ctx.save();
				let glow = 0;
				if (pipe.highlight > 0) {
					// Pulse: fast fade-in (first 4 frames), slow fade-out (next 120 frames)
					if (pipe.highlight >= 121) {
						glow = (124 - pipe.highlight) / 4; // fade-in: 0 to 1 over 4 frames
					} else {
						glow = pipe.highlight / 120; // fade-out: 1 to 0 over 120 frames
					}
				}
				ctx.fillStyle = '#00ffe7';
				ctx.shadowColor = '#00ffe7';
				ctx.shadowBlur = 8 + 18 * glow; // less strong effect
				ctx.globalAlpha = 1;
				// Top pipe
				ctx.fillRect(pipe.x, 0, pipe.width, pipe.gapY);
				// Bottom pipe
				ctx.fillRect(pipe.x, pipe.gapY + pipe.gapHeight, pipe.width, canvas.height - (pipe.gapY + pipe.gapHeight));
				ctx.restore();
				if (pipe.highlight > 0) pipe.highlight--;
			}
			// Draw cube
			ctx.save();
			ctx.fillStyle = '#ff00c8';
			ctx.shadowColor = '#ff00c8';
			ctx.shadowBlur = 16;
			ctx.fillRect(cube.x, cube.y, cube.size, cube.size);
			ctx.restore();
			// Draw score
			if (gameActive) {
				ctx.save();
				ctx.font = `bold ${Math.floor(canvas.height * 0.07)}px 'Press Start 2P', 'VT323', monospace`;
				ctx.fillStyle = '#fff';
				ctx.textAlign = 'center';
				ctx.textBaseline = 'top';
				ctx.shadowColor = '#00ffe7';
				ctx.shadowBlur = 8;
				ctx.fillText(score, canvas.width/2, 12);
				ctx.restore();
			}
			// Draw start screen overlay
			if (showStartScreen) {
				ctx.save();
				ctx.globalAlpha = 0.92;
				ctx.fillStyle = '#18181b';
				ctx.fillRect(0, 0, canvas.width, canvas.height);
				ctx.globalAlpha = 1;
				ctx.textAlign = 'center';
				ctx.textBaseline = 'top';
				// Title
				ctx.font = `bold ${Math.floor(canvas.height * 0.06)}px 'Press Start 2P', 'VT323', monospace`;
				ctx.fillStyle = '#00ffe7';
		// Layout positions
		const titleY = canvas.height * 0.08;
	// Center high score label and number vertically
	const scoreLabelY = canvas.height * 0.42;
	const scoreNumY = scoreLabelY + canvas.height * 0.07;
		const instrY = canvas.height * 0.85;
		// Title at top center
		ctx.font = `bold ${Math.floor(canvas.height * 0.06)}px 'Press Start 2P', 'VT323', monospace`;
		ctx.fillStyle = '#00ffe7';
		ctx.fillText('FlappyCube', canvas.width/2, titleY, canvas.width * 0.9);
		// Last round score (minimal, above high score)
		if (lastScore !== null) {
			// Calculate center between title and high score label
			const lastScoreCenterY = (titleY + scoreLabelY) / 2;
			ctx.font = `bold ${Math.floor(canvas.height * 0.028)}px 'Press Start 2P', 'VT323', monospace`;
			ctx.fillStyle = '#fff';
			ctx.globalAlpha = 0.7;
			ctx.fillText('Last Score', canvas.width/2, lastScoreCenterY - canvas.height * 0.03, canvas.width * 0.9);
			ctx.font = `bold ${Math.floor(canvas.height * 0.055)}px 'Press Start 2P', 'VT323', monospace`;
			ctx.globalAlpha = 0.8;
			ctx.fillText(lastScore, canvas.width/2, lastScoreCenterY + canvas.height * 0.01, canvas.width * 0.9);
			ctx.globalAlpha = 1;
		}
		// High Score label centered
		ctx.font = `bold ${Math.floor(canvas.height * 0.03)}px 'Press Start 2P', 'VT323', monospace`;
		ctx.fillStyle = '#ff00c8';
		ctx.fillText('High Score', canvas.width/2, scoreLabelY, canvas.width * 0.9);
		// High Score number large and centered
		ctx.font = `bold ${Math.floor(canvas.height * 0.11)}px 'Press Start 2P', 'VT323', monospace`;
		ctx.fillStyle = '#fff';
		ctx.fillText(highScore, canvas.width/2, scoreNumY, canvas.width * 0.9);
		// Average score styled like last score, centered between high score and tap to start
		if (lastScores.length > 0) {
			const avg = Math.round(lastScores.reduce((a, b) => a + b, 0) / lastScores.length);
			const avgCenterY = (scoreNumY + instrY) / 2;
			ctx.font = `bold ${Math.floor(canvas.height * 0.028)}px 'Press Start 2P', 'VT323', monospace`;
			ctx.fillStyle = '#fff';
			ctx.globalAlpha = 0.7;
			ctx.fillText('Average Score', canvas.width/2, avgCenterY - canvas.height * 0.03, canvas.width * 0.9);
			ctx.font = `bold ${Math.floor(canvas.height * 0.055)}px 'Press Start 2P', 'VT323', monospace`;
			ctx.globalAlpha = 0.8;
			ctx.fillText(avg, canvas.width/2, avgCenterY + canvas.height * 0.01, canvas.width * 0.9);
			ctx.globalAlpha = 1;
		}
		// BADGES: Milestones with emoji
		// Define 20 milestones and emojis
		const badgeMilestones = [
			{score: 1, emoji: '🐣', label: 'First Flap'},
			{score: 5, emoji: '🟪', label: 'Cube Novice'},
			{score: 10, emoji: '🟩', label: 'Getting Started'},
			{score: 15, emoji: '🌱', label: 'Sprout'},
			{score: 20, emoji: '💎', label: 'Gem'},
			{score: 25, emoji: '🦄', label: 'Unicorn'},
			{score: 30, emoji: '🔥', label: 'On Fire'},
			{score: 35, emoji: '🎯', label: 'Sharpshooter'},
			{score: 40, emoji: '🚀', label: 'Rocket'},
			{score: 45, emoji: '🌟', label: 'Star'},
			{score: 50, emoji: '🏆', label: 'Champion'},
			{score: 60, emoji: '🧠', label: 'Brainiac'},
			{score: 70, emoji: '👑', label: 'Royalty'},
			{score: 80, emoji: '🦾', label: 'Machine'},
			{score: 90, emoji: '🕹️', label: 'Gamer'},
			{score: 100, emoji: '🌈', label: 'Legend'},
			{score: 120, emoji: '🧙‍♂️', label: 'Wizard'},
			{score: 150, emoji: '🦅', label: 'Eagle'},
			{score: 200, emoji: '💯', label: 'Centurion'},
			{score: 300, emoji: '👽', label: 'Alien'}
		];
		// Find earned badges
		let earnedBadges = badgeMilestones.filter(b => highScore >= b.score);
		// Draw badges in a grid below the scores and store clickable regions
		window.badgeRegions = [];
		if (earnedBadges.length > 0) {
			const badgeRows = Math.ceil(earnedBadges.length / 10);
			const badgeSize = Math.floor(canvas.height * 0.045);
			const badgeYStart = scoreNumY + canvas.height * 0.13;
			ctx.font = `${badgeSize}px 'Segoe UI Emoji', 'Press Start 2P', 'VT323', monospace`;
			ctx.textAlign = 'center';
			ctx.textBaseline = 'middle';
			for (let row = 0; row < badgeRows; row++) {
				let badgesInRow = earnedBadges.slice(row * 10, (row + 1) * 10);
				let rowY = badgeYStart + row * (badgeSize + 6);
				let spacing = canvas.width / (badgesInRow.length + 1);
				for (let i = 0; i < badgesInRow.length; i++) {
					let badge = badgesInRow[i];
					let x = spacing * (i + 1);
					ctx.globalAlpha = 1;
					ctx.fillText(badge.emoji, x, rowY);
					// Store clickable region for badge
					window.badgeRegions.push({
						x: x,
						y: rowY,
						r: badgeSize * 0.6,
						badge: badge
					});
				}
			}
			// (No badge labels under emoji; info is in popup)
			ctx.globalAlpha = 1;
		}
		// Draw badge popup if needed
		if (window.badgePopup) {
			const popup = window.badgePopup;
			const popupW = Math.floor(canvas.width * 0.5);
			const popupH = Math.floor(canvas.height * 0.22);
			const popupX = canvas.width/2 - popupW/2;
			const popupY = canvas.height/2 - popupH/2;
			ctx.save();
			ctx.globalAlpha = 0.98;
			ctx.fillStyle = '#22223b';
			ctx.strokeStyle = '#00ffe7';
			ctx.lineWidth = 5;
			ctx.beginPath();
			ctx.roundRect(popupX, popupY, popupW, popupH, 24);
			ctx.fill();
			ctx.stroke();
			ctx.globalAlpha = 1;
			ctx.textAlign = 'center';
			ctx.textBaseline = 'middle';
			ctx.font = `bold ${Math.floor(popupH * 0.32)}px 'Segoe UI Emoji', 'Press Start 2P', 'VT323', monospace`;
			ctx.fillStyle = '#00ffe7';
			ctx.fillText(popup.badge.emoji, canvas.width/2, popupY + popupH * 0.32);
			ctx.font = `bold ${Math.floor(popupH * 0.18)}px 'VT323', monospace`;
			ctx.fillStyle = '#fff';
			ctx.fillText(popup.badge.label, canvas.width/2, popupY + popupH * 0.62);
			ctx.font = `bold ${Math.floor(popupH * 0.13)}px 'VT323', monospace`;
			ctx.fillStyle = '#ff00c8';
			ctx.fillText(`Score: ${popup.badge.score}`, canvas.width/2, popupY + popupH * 0.82);
			ctx.restore();
		}
		// Instructions at bottom center
		ctx.font = `bold ${Math.floor(canvas.height * 0.035)}px 'Press Start 2P', 'VT323', monospace`;
		ctx.fillStyle = '#fff';
		ctx.fillText('Tap to start!', canvas.width/2, instrY, canvas.width * 0.9);
		ctx.restore();
	}
		}

		let pipeTimer = 0;
		function gameLoop() {
			if (gameActive) {
				cube.vy += cube.gravity;
				cube.y += cube.vy;
				// Floor collision
				if (cube.y + cube.size > canvas.height) {
					cube.y = canvas.height - cube.size;
					cube.vy = 0;
					gameActive = false;
					// Game over, update high score and show start screen
					if (score > highScore) {
						highScore = score;
						localStorage.setItem('flappycube_highscore', highScore);
					}
					lastScore = score;
					lastScores.push(score);
					if (lastScores.length > 5) lastScores.shift();
					showStartScreen = true;
					canStart = false;
					setTimeout(() => { canStart = true; }, 1000);
				}
				// Ceiling collision
				if (cube.y < 0) {
					cube.y = 0;
					cube.vy = 0;
				}
				// Pipes logic
				pipeTimer++;
				if (pipeTimer % Math.floor(canvas.width / (pipeSpeed * 2)) === 0) {
					spawnPipe();
				}
				for (let pipe of pipes) {
					pipe.x -= pipeSpeed;
				}
				// Remove pipes off screen
				while (pipes.length && pipes[0].x + pipes[0].width < 0) {
					pipes.shift();
				}
				// Collision detection
				for (let pipe of pipes) {
					if (
						cube.x + cube.size > pipe.x && cube.x < pipe.x + pipe.width &&
						(cube.y < pipe.gapY || cube.y + cube.size > pipe.gapY + pipe.gapHeight)
					) {
						gameActive = false;
						playDeath();
						// Game over, update high score and show start screen
						if (score > highScore) {
							highScore = score;
							localStorage.setItem('flappycube_highscore', highScore);
						}
						lastScore = score;
						lastScores.push(score);
						if (lastScores.length > 5) lastScores.shift();
						showStartScreen = true;
						canStart = false;
						setTimeout(() => { canStart = true; }, 1000);
					}
					// Score
					if (!pipe.passed && pipe.x + pipe.width < cube.x) {
						pipe.passed = true;
						pipe.highlight = 124; // pulse for 124 frames (~2s)
						score++;
						playScore();
					}
				}
			} else {
				pipeTimer = 0;
			}
			drawUI();
			requestAnimationFrame(gameLoop);
		}

		let spacePressed = false;
		document.addEventListener('keydown', function(e) {
			if (!canStart && showStartScreen) return; // Block input after death until allowed
			if (e.code === 'Space' && !e.repeat && !spacePressed) {
				spacePressed = true;
				if (showStartScreen && canStart) {
					showStartScreen = false;
					gameActive = true;
					cube.vy = cube.jump;
					resetGame();
					playJump();
				} else if (!gameActive) {
					gameActive = true;
					cube.vy = cube.jump;
					resetGame();
					playJump();
				} else {
					cube.vy = cube.jump;
					playJump();
				}
			}
		});
		document.addEventListener('keyup', function(e) {
			if (e.code === 'Space') {
				spacePressed = false;
			}
		});

		// Unified touch handler for start screen (badges and start)
		canvas.addEventListener('touchstart', function(e) {
			if (!showStartScreen) return;
			const rect = canvas.getBoundingClientRect();
			const touch = e.touches[0];
			const mx = (touch.clientX - rect.left) * (canvas.width / rect.width);
			const my = (touch.clientY - rect.top) * (canvas.height / rect.height);
			// If popup is open, dismiss it on any touch
			if (window.badgePopup) {
				window.badgePopup = null;
				drawUI();
				return;
			}
			// Otherwise, check for badge touch
			if (window.badgeRegions) {
				for (let region of window.badgeRegions) {
					let dx = mx - region.x;
					let dy = my - region.y;
					if (dx*dx + dy*dy < region.r*region.r) {
						window.badgePopup = { badge: region.badge };
						drawUI();
						return;
					}
				}
			}
			// If not touching a badge, start the game (if allowed)
			if (canStart) {
				showStartScreen = false;
				gameActive = true;
				cube.vy = cube.jump;
				resetGame();
				playJump();
			}
		});

		// Mouse click support for desktop (game actions only, not start screen)
		canvas.addEventListener('mousedown', function(e) {
			if (showStartScreen) return; // Let unified handler below handle start screen clicks
			if (!canStart && showStartScreen) return; // Block input after death until allowed
			if (!gameActive) {
				gameActive = true;
				cube.vy = cube.jump;
				resetGame();
				playJump();
			} else {
				cube.vy = cube.jump;
				playJump();
			}
		});

		// Initial resize and start loop
		resizeCanvas();
		requestAnimationFrame(gameLoop);

		// Unified start screen click handler (badges and start)
		canvas.addEventListener('mousedown', function(e) {
			if (!showStartScreen) return;
			const rect = canvas.getBoundingClientRect();
			const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
			const my = (e.clientY - rect.top) * (canvas.height / rect.height);
			// If popup is open, dismiss it on any click
			if (window.badgePopup) {
				window.badgePopup = null;
				drawUI();
				return;
			}
			// Otherwise, check for badge click
			if (window.badgeRegions) {
				for (let region of window.badgeRegions) {
					let dx = mx - region.x;
					let dy = my - region.y;
					if (dx*dx + dy*dy < region.r*region.r) {
						window.badgePopup = { badge: region.badge };
						drawUI();
						return;
					}
				}
			}
			// If not clicking a badge, start the game (if allowed)
			if (canStart) {
				showStartScreen = false;
				gameActive = true;
				cube.vy = cube.jump;
				resetGame();
				playJump();
			}
		});
	</script>
</body>
