	<script>
	// Secret mobile dev menu trigger: long-press top-right corner
	document.addEventListener('DOMContentLoaded', function() {
		let touchTimer;
		const LONG_PRESS_DURATION = 1200; // ms
		// Create invisible trigger area
		const trigger = document.createElement('div');
		trigger.style.position = 'fixed';
		trigger.style.top = '0';
		trigger.style.right = '0';
		trigger.style.width = '48px';
		trigger.style.height = '48px';
		trigger.style.zIndex = '9999';
		trigger.style.background = 'transparent';
		trigger.style.touchAction = 'none';
		trigger.style.userSelect = 'none';
		trigger.setAttribute('aria-hidden','true');
		document.body.appendChild(trigger);
		trigger.addEventListener('touchstart', function(e) {
			if (touchTimer) clearTimeout(touchTimer);
			touchTimer = setTimeout(function() {
				const menu = document.getElementById('devMenu');
				menu.style.display = 'flex';
			}, LONG_PRESS_DURATION);
		});
		trigger.addEventListener('touchend', function(e) {
			if (touchTimer) clearTimeout(touchTimer);
		});
		trigger.addEventListener('touchmove', function(e) {
			if (touchTimer) clearTimeout(touchTimer);
		});
	});
	// Make badgeBar scroll in increments of rows and allow all rows to reach the top
	document.addEventListener('DOMContentLoaded', function() {
		const badgeBar = document.getElementById('badgeBar');
		if (!badgeBar) return;
		// Estimate row height (2em font size + gap/padding)
		const rowHeight = 48; // px, adjust if needed for your layout
		badgeBar.addEventListener('wheel', function(e) {
			if (badgeBar.scrollHeight <= badgeBar.clientHeight) return;
			e.preventDefault();
			const direction = Math.sign(e.deltaY);
			// Snap scroll to next/prev row
				badgeBar.scrollTop += direction * rowHeight * 1;
			// Clamp so last row can reach top
			if (badgeBar.scrollTop > badgeBar.scrollHeight - badgeBar.clientHeight) {
				badgeBar.scrollTop = badgeBar.scrollHeight - badgeBar.clientHeight;
			}
			if (badgeBar.scrollTop < 0) badgeBar.scrollTop = 0;
		}, { passive: false });
	});

// New Game Button and Verification Logic
document.addEventListener('DOMContentLoaded', function() {

});
// 100 unique badges for every 5 gates (score) up to 500
const badgeEmojisUnique = [
	'⭐','🌟','🥉','🥈','🥇','🏅','🏆','💎','👑','🚀',
	'🎉','🎊','🎈','🎂','🍰','🍭','🍬','🍫','🍿','🧁',
	'🍕','🍔','🍟','🌭','🥪','🥗','🍣','🍤','🍦','🍩',
	'🍪','🥨','🥯','🧀','🍖','🍗','🥓','🥚','🍳','🥞',
	'🧇','🥥','🥝','🍇','🍉','🍊','🍋','🍌','🍍','🥭',
	'🍎','🍏','🍐','🍑','🍒','🍓','🫐','🥕','🌽','🥒',
	'🥬','🥦','🧄','🧅','🍄','🥜','🌰','🍞','🥐','🥖',
	'🥨','🥯','🥞','🧇','🧈','🧊','🥤','🧃','🧉','🍵',
	'☕','🧋','🍺','🍻','🥂','🍷','🥃','🍸','🍹','🍾',
	'🧊','🧦','🦄','🦆','🦑','🦖','🦕','🦚','🦞','🦷',
	'🧠','💩','👽','😜','🤪','😎','🤩','🥳','😺','😻'
];

const milestoneBadges = Array.from({length: 100}, (_, i) => {
	const gates = (i + 1) * 5;
	return {
		emoji: badgeEmojisUnique[i],
		title: `Gate ${gates}`,
		desc: `Pass ${gates} gates.`
	};
});

// Track earned badges in localStorage
function getEarnedBadges() {
	let earned = localStorage.getItem('flappycube_badges');
	if (!earned) return Array(milestoneBadges.length).fill(false);
	return JSON.parse(earned);
}
function setEarnedBadge(idx) {
	let arr = getEarnedBadges();
	arr[idx] = true;
	localStorage.setItem('flappycube_badges', JSON.stringify(arr));
	localStorage.setItem('flappycube_lastbadge', idx); // Track most recent badge
}

// Render only earned badges above the map
function renderBadges() {
	const bar = document.getElementById('badgeBar');
	bar.innerHTML = '';
	const earned = getEarnedBadges();
	milestoneBadges.forEach((badge, i) => {
		const btn = document.createElement('button');
		btn.className = 'badge-btn';
		btn.setAttribute('tabindex',0);
		btn.setAttribute('aria-label',badge.title);
		btn.style.background='none';
		btn.style.border='none';
	btn.style.fontSize='1.7em';
		btn.style.cursor = earned[i] ? 'pointer' : 'default';
		btn.style.transition='transform 0.15s';
		btn.style.filter='drop-shadow(0 0 6px #00ffe7cc)';
		btn.innerText = badge.emoji;
		if (earned[i]) {
			btn.style.opacity = '1';
			btn.onclick = () => showBadgeModal(i);
			btn.onpointerdown = () => btn.style.transform='scale(1.2)';
			btn.onpointerup = btn.onpointerleave = () => btn.style.transform='scale(1)';
			bar.appendChild(btn);
		}
	});
	// Add two invisible rows for extra scroll space
	for (let i = 0; i < 2; i++) {
		const spacer = document.createElement('div');
		spacer.className = 'badge-row-invisible';
		bar.appendChild(spacer);
	}
}

function showBadgeModal(idx) {
	const badge = milestoneBadges[idx];
	document.getElementById('badgeModalEmoji').innerText = badge.emoji;
	document.getElementById('badgeModalTitle').innerText = badge.title;
	document.getElementById('badgeModalDesc').innerText = badge.desc;
	document.getElementById('badgeModal').style.display = 'flex';
}
function closeBadgeModal() {
	document.getElementById('badgeModal').style.display = 'none';
}
window.addEventListener('DOMContentLoaded', renderBadges);

function checkAchievements() {
	// Gate achievement badges (only for current run)
	let earned = getEarnedBadges();
	for (let i = 0; i < milestoneBadges.length; i++) {
		const gateScore = (i + 1) * 5;
		// Only award if score in this run reaches the gate count
		if (!earned[i] && score === gateScore) {
			setEarnedBadge(i);
			renderBadges();
			localStorage.setItem('flappycube_lastbadge', i);
		}
	}
}

	  localStorage.setItem('flappycube_badges', JSON.stringify(Array(milestoneBadges.length).fill(true)));

	function devAddNextBadge() {
	  let earned = getEarnedBadges();
	  for (let i = 0; i < earned.length; i++) {
	    if (!earned[i]) {
	      earned[i] = true;
	      break;

			ctx.fillText('Average Score', canvas.width/2, avgCenterY - canvas.height * 0.03, canvas.width * 0.9);
			ctx.font = `bold ${Math.floor(canvas.height * 0.055)}px 'Press Start 2P', 'VT323', monospace`;
			ctx.globalAlpha = 0.8;
			ctx.fillText(avg, canvas.width/2, avgCenterY + canvas.height * 0.01, canvas.width * 0.9);
			ctx.globalAlpha = 1;
		}
		// Instructions at bottom center
		ctx.font = `bold ${Math.floor(canvas.height * 0.035)}px 'Press Start 2P', 'VT323', monospace`;
		ctx.fillStyle = '#fff';
	ctx.fillText('Tap to start!', canvas.width/2, instrY, canvas.width * 0.9);
				ctx.restore();
			}
		}

		let pipeTimer = 0;
		function gameLoop() {
			if (gameActive) {
				// Frame-rate independent movement for all devices
				let now = performance.now();
				window._lastFrame = window._lastFrame || now;
				let dt = Math.min((now - window._lastFrame) / 1000, 0.05); // seconds, clamp to avoid huge jumps
				window._lastFrame = now;
				let frameScale = dt * 60; // 1 for 60fps, <1 for higher fps, >1 for lower
				cube.vy += cube.gravity * frameScale;
				cube.y += cube.vy * frameScale;
				// Particle trail logic
				spawnCubeParticle();
				updateCubeParticles();
				// Floor collision
				if (cube.y + cube.size > canvas.height) {
					cube.y = canvas.height - cube.size;
					cube.vy = 0;
					gameActive = false;
					// Game over, update high score and show start screen
					if (score > highScore) {
						highScore = score;
						localStorage.setItem('flappycube_highscore', highScore);
					}
					lastScore = score;
					lastScores.push(score);
					if (lastScores.length > 5) lastScores.shift();
					showStartScreen = true;
					canStart = false;
					setTimeout(() => { canStart = true; }, 1000);
				}
				// Ceiling collision
				if (cube.y < 0) {
					cube.y = 0;
					cube.vy = 0;
				}
				// Pipes logic
				pipeTimer++;
				// Frame-rate independent gate spacing
				// Spread out gates: spawn pipes less frequently for higher speed
				if (pipeTimer % Math.floor(canvas.width / (pipeSpeed * 4.5)) === 0) {
					spawnPipe();
				}
				for (let pipe of pipes) {
					pipe.x -= pipeSpeed * frameScale;
				}
				// Remove pipes off screen
				while (pipes.length && pipes[0].x + pipes[0].width < 0) {
					pipes.shift();
				}
				// Collision detection
				for (let pipe of pipes) {
					if (
						cube.x + cube.size > pipe.x && cube.x < pipe.x + pipe.width &&
						(cube.y < pipe.gapY || cube.y + cube.size > pipe.gapY + pipe.gapHeight)
					) {
						gameActive = false;
						playDeath();
						// Game over, update high score and show start screen
						if (score > highScore) {
							highScore = score;
							localStorage.setItem('flappycube_highscore', highScore);
						}
						lastScore = score;
						lastScores.push(score);
						if (lastScores.length > 5) lastScores.shift();
						showStartScreen = true;
						canStart = false;
						setTimeout(() => { canStart = true; }, 1000);
					}
					// Score
					if (!pipe.passed && pipe.x + pipe.width < cube.x) {
						pipe.passed = true;
						pipe.highlight = 124; // pulse for 124 frames (~2s)
						score++;
						playScore();
					}
				}
			} else {
				pipeTimer = 0;
			}
			drawUI();
			requestAnimationFrame(gameLoop);
		}

		let spacePressed = false;
		document.addEventListener('keydown', function(e) {
			if (!canStart && showStartScreen) return; // Block input after death until allowed
			if (e.code === 'Space' && !e.repeat && !spacePressed) {
				spacePressed = true;
				if (showStartScreen && canStart) {
					showStartScreen = false;
					gameActive = true;
					cube.vy = cube.jump;
					resetGame();
					window._playReverseScaleOnStart = true;
					playJump();
				} else if (!gameActive) {
					gameActive = true;
					cube.vy = cube.jump;
					resetGame();
					window._playReverseScaleOnStart = true;
					playJump();
				} else {
					cube.vy = cube.jump;
					playJump();
				}
			}
		});
		document.addEventListener('keyup', function(e) {
			if (e.code === 'Space') {
				spacePressed = false;
			}
		});

		// Touch support for mobile
		canvas.addEventListener('touchstart', function(e) {
			e.preventDefault();
			if (!canStart && showStartScreen) return; // Block input after death until allowed
			if (showStartScreen && canStart) {
				showStartScreen = false;
				gameActive = true;
				cube.vy = cube.jump;
				resetGame();
				window._playReverseScaleOnStart = true;
				playJump();
			} else if (!gameActive) {
				gameActive = true;
				cube.vy = cube.jump;
				resetGame();
				playJump();
			} else {
				cube.vy = cube.jump;
				playJump();
			}
		});

		// Mouse click support for desktop
		canvas.addEventListener('mousedown', function(e) {
			if (!canStart && showStartScreen) return; // Block input after death until allowed
			if (showStartScreen && canStart) {
				showStartScreen = false;
				gameActive = true;
				cube.vy = cube.jump;
				resetGame();
				window._playReverseScaleOnStart = true;
				playJump();
			} else if (!gameActive) {
				gameActive = true;
				cube.vy = cube.jump;
				resetGame();
				playJump();
			} else {
				cube.vy = cube.jump;
				playJump();
			}
		});

		// Initial resize and start loop
		resizeCanvas();
		requestAnimationFrame(gameLoop);
	</script>
</body>
